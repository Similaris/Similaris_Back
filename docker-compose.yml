services:
  db:
    image: postgres:16-alpine
    container_name: similaris-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Configure POSTGRES_USER no arquivo .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD no arquivo .env}
      POSTGRES_DB: ${POSTGRES_DB:?Configure POSTGRES_DB no arquivo .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: similaris-api
    environment:
      DATABASE_URL: ${DATABASE_URL:?Configure DATABASE_URL no arquivo .env}
      REDIS_URL: ${REDIS_URL:?Configure REDIS_URL no arquivo .env}
      SEGMENT_MAX_WORDS: ${SEGMENT_MAX_WORDS:-150}
      LEXICAL_COSINE_THRESHOLD: ${LEXICAL_COSINE_THRESHOLD:-0.5}
      LEXICAL_JACCARD_THRESHOLD: ${LEXICAL_JACCARD_THRESHOLD:-0.2}
      SEMANTIC_MODEL_NAME: ${SEMANTIC_MODEL_NAME:-sentence-transformers/all-MiniLM-L6-v2}
      REFERENCE_INDEX_DIR: ${REFERENCE_INDEX_DIR:-data/reference-index}
      REFERENCE_SEARCH_MODE: ${REFERENCE_SEARCH_MODE:-semantic}
      REFERENCE_SEARCH_TOP_N: ${REFERENCE_SEARCH_TOP_N:-5}
      REFERENCE_SEARCH_SEMANTIC_THRESHOLD: ${REFERENCE_SEARCH_SEMANTIC_THRESHOLD:-0.5}
      HYBRID_TFIDF_WEIGHT: ${HYBRID_TFIDF_WEIGHT:-0.7}
      HYBRID_JACCARD_WEIGHT: ${HYBRID_JACCARD_WEIGHT:-0.3}
      HYBRID_LEXICAL_WEIGHT: ${HYBRID_LEXICAL_WEIGHT:-0.5}
      HYBRID_SEMANTIC_WEIGHT: ${HYBRID_SEMANTIC_WEIGHT:-0.5}
      HYBRID_CLASSIFICATION_MODERATE_THRESHOLD: ${HYBRID_CLASSIFICATION_MODERATE_THRESHOLD:-0.4}
      HYBRID_CLASSIFICATION_HIGH_THRESHOLD: ${HYBRID_CLASSIFICATION_HIGH_THRESHOLD:-0.6}
      HYBRID_CLASSIFICATION_VERY_HIGH_THRESHOLD: ${HYBRID_CLASSIFICATION_VERY_HIGH_THRESHOLD:-0.8}
      HYBRID_SUSPICIOUS_FINAL_THRESHOLD: ${HYBRID_SUSPICIOUS_FINAL_THRESHOLD:-0.6}
      HYBRID_SUSPICIOUS_SEMANTIC_THRESHOLD: ${HYBRID_SUSPICIOUS_SEMANTIC_THRESHOLD:-0.8}
      HYBRID_SUSPICIOUS_TFIDF_THRESHOLD: ${HYBRID_SUSPICIOUS_TFIDF_THRESHOLD:-0.7}
      HYBRID_SUSPICIOUS_JACCARD_THRESHOLD: ${HYBRID_SUSPICIOUS_JACCARD_THRESHOLD:-0.5}
      HYBRID_TOP_N: ${HYBRID_TOP_N:-5}
      HF_HOME: /app/data/huggingface
      UPLOAD_DIR: ${UPLOAD_DIR:-uploads}
      UPLOAD_MAX_FILE_SIZE_MB: ${UPLOAD_MAX_FILE_SIZE_MB:-20}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Configure JWT_SECRET_KEY no arquivo .env}
      JWT_ACCESS_TOKEN_EXPIRES_IN: ${JWT_ACCESS_TOKEN_EXPIRES_IN:-480}
      JWT_REFRESH_TOKEN_EXPIRES_IN: ${JWT_REFRESH_TOKEN_EXPIRES_IN:-10080}
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:5174"]'
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/uploads
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: similaris-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Configure REDIS_PASSWORD no arquivo .env}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    build: .
    container_name: similaris-worker
    command:
      [
        "celery",
        "-A",
        "app.core.celery_app.celery_app",
        "worker",
        "--loglevel=info",
        "--concurrency=2",
      ]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Configure DATABASE_URL no arquivo .env}
      REDIS_URL: ${REDIS_URL:?Configure REDIS_URL no arquivo .env}
      SEGMENT_MAX_WORDS: ${SEGMENT_MAX_WORDS:-150}
      LEXICAL_COSINE_THRESHOLD: ${LEXICAL_COSINE_THRESHOLD:-0.5}
      LEXICAL_JACCARD_THRESHOLD: ${LEXICAL_JACCARD_THRESHOLD:-0.2}
      SEMANTIC_MODEL_NAME: ${SEMANTIC_MODEL_NAME:-sentence-transformers/all-MiniLM-L6-v2}
      REFERENCE_INDEX_DIR: ${REFERENCE_INDEX_DIR:-data/reference-index}
      REFERENCE_SEARCH_MODE: ${REFERENCE_SEARCH_MODE:-semantic}
      REFERENCE_SEARCH_TOP_N: ${REFERENCE_SEARCH_TOP_N:-5}
      REFERENCE_SEARCH_SEMANTIC_THRESHOLD: ${REFERENCE_SEARCH_SEMANTIC_THRESHOLD:-0.5}
      HYBRID_TFIDF_WEIGHT: ${HYBRID_TFIDF_WEIGHT:-0.7}
      HYBRID_JACCARD_WEIGHT: ${HYBRID_JACCARD_WEIGHT:-0.3}
      HYBRID_LEXICAL_WEIGHT: ${HYBRID_LEXICAL_WEIGHT:-0.5}
      HYBRID_SEMANTIC_WEIGHT: ${HYBRID_SEMANTIC_WEIGHT:-0.5}
      HYBRID_CLASSIFICATION_MODERATE_THRESHOLD: ${HYBRID_CLASSIFICATION_MODERATE_THRESHOLD:-0.4}
      HYBRID_CLASSIFICATION_HIGH_THRESHOLD: ${HYBRID_CLASSIFICATION_HIGH_THRESHOLD:-0.6}
      HYBRID_CLASSIFICATION_VERY_HIGH_THRESHOLD: ${HYBRID_CLASSIFICATION_VERY_HIGH_THRESHOLD:-0.8}
      HYBRID_SUSPICIOUS_FINAL_THRESHOLD: ${HYBRID_SUSPICIOUS_FINAL_THRESHOLD:-0.6}
      HYBRID_SUSPICIOUS_SEMANTIC_THRESHOLD: ${HYBRID_SUSPICIOUS_SEMANTIC_THRESHOLD:-0.8}
      HYBRID_SUSPICIOUS_TFIDF_THRESHOLD: ${HYBRID_SUSPICIOUS_TFIDF_THRESHOLD:-0.7}
      HYBRID_SUSPICIOUS_JACCARD_THRESHOLD: ${HYBRID_SUSPICIOUS_JACCARD_THRESHOLD:-0.5}
      HYBRID_TOP_N: ${HYBRID_TOP_N:-5}
      HF_HOME: /app/data/huggingface
      UPLOAD_DIR: ${UPLOAD_DIR:-uploads}
      UPLOAD_MAX_FILE_SIZE_MB: ${UPLOAD_MAX_FILE_SIZE_MB:-20}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Configure JWT_SECRET_KEY no arquivo .env}
    volumes:
      - uploads:/app/uploads
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  uploads:
