services:
  db:
    image: postgres:16-alpine
    container_name: similaris-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Configure POSTGRES_USER no arquivo .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD no arquivo .env}
      POSTGRES_DB: ${POSTGRES_DB:?Configure POSTGRES_DB no arquivo .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: similaris-api
    environment:
      DATABASE_URL: ${DATABASE_URL:?Configure DATABASE_URL no arquivo .env}
      REDIS_URL: ${REDIS_URL:?Configure REDIS_URL no arquivo .env}
      SEGMENT_MAX_WORDS: ${SEGMENT_MAX_WORDS:-150}
      LEXICAL_COSINE_THRESHOLD: ${LEXICAL_COSINE_THRESHOLD:-0.5}
      LEXICAL_JACCARD_THRESHOLD: ${LEXICAL_JACCARD_THRESHOLD:-0.2}
      UPLOAD_DIR: ${UPLOAD_DIR:-uploads}
      UPLOAD_MAX_FILE_SIZE_MB: ${UPLOAD_MAX_FILE_SIZE_MB:-20}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Configure JWT_SECRET_KEY no arquivo .env}
      JWT_ACCESS_TOKEN_EXPIRES_IN: ${JWT_ACCESS_TOKEN_EXPIRES_IN:-480}
      JWT_REFRESH_TOKEN_EXPIRES_IN: ${JWT_REFRESH_TOKEN_EXPIRES_IN:-10080}
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:5174"]'
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: similaris-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Configure REDIS_PASSWORD no arquivo .env}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
  uploads:
